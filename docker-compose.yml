services:
  postgres:
    image: postgres:16-alpine
    container_name: wear_birgunj_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wear_birgunj
      POSTGRES_USER: wear_birgunj_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wear_birgunj_migrator -d wear_birgunj"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wear_birgunj_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
